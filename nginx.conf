server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;
    gzip_comp_level 6;

    # Cache static assets aggressively
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cache HTML files
    location ~* \.(?:html)$ {
        expires 1h;
        add_header Cache-Control "public, no-cache";
        try_files $uri =404;
    }

    # SPA-like routing for clean URLs
    location /services-prospecting {
        try_files $uri $uri.html $uri/ /services-prospecting.html =404;
    }

    location /services-appointment-setting {
        try_files $uri $uri.html $uri/ /services-appointment-setting.html =404;
    }

    location /services-coaching {
        try_files $uri $uri.html $uri/ /services-coaching.html =404;
    }

    location /how-i-work {
        try_files $uri $uri.html $uri/ /how-i-work.html =404;
    }

    location /experience {
        try_files $uri $uri.html $uri/ /experience.html =404;
    }

    location /contact {
        try_files $uri $uri.html $uri/ /contact.html =404;
    }

    # Blog routes
    location /blog/b2b-lead-qualification {
        try_files $uri $uri.html $uri/ /blog/b2b-lead-qualification.html =404;
    }

    location /blog/b2b-cold-calling-techniques {
        try_files $uri $uri.html $uri/ /blog/b2b-cold-calling-techniques.html =404;
    }

    location /blog/appointment-setting-strategies {
        try_files $uri $uri.html $uri/ /blog/appointment-setting-strategies.html =404;
    }

    location /blog/sdr-vs-bdr {
        try_files $uri $uri.html $uri/ /blog/sdr-vs-bdr.html =404;
    }

    location /blog/outbound-sales-guide {
        try_files $uri $uri.html $uri/ /blog/outbound-sales-guide.html =404;
    }

    location /blog/handle-send-me-an-email {
        try_files $uri $uri.html $uri/ /blog/handle-send-me-an-email.html =404;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data:; font-src 'self' https: data:; script-src 'self' https: 'unsafe-inline' 'unsafe-eval'; style-src 'self' https: 'unsafe-inline';" always;

    # Prevent directory listing
    autoindex off;

    # Custom error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    # Serve sitemap and robots
    location = /sitemap.xml {
        types { application/xml xml; }
        try_files $uri =404;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    # Health check endpoint
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}