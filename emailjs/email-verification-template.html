<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Flynn James Email Verification</title>
<style>body{font-family:Arial,sans-serif;background:#0b0f19;margin:0;padding:0}.container{max-width:560px;margin:auto;padding:35px 18px}.card{background:#131b2c;border:1px solid #263248;border-radius:16px;padding:32px;color:#f8fafc}.logo{text-align:center;font-size:23px;font-weight:900;letter-spacing:.14em;margin-bottom:20px}.logo span{color:#06b6d4}.code{font-size:34px;letter-spacing:.3em;font-weight:800;color:#67e8f9;text-align:center;background:#0b0f19;border:1px solid #334155;border-radius:12px;padding:18px;margin:22px 0}.copy{color:#9cb0cb;line-height:1.7;font-size:14px}</style>
</head><body><div class="container"><div class="card"><div class="logo"><span>F</span>LYNN</div><h2 style="margin:0 0 10px">Verify your email</h2><p class="copy">Hi {{name}}, use the verification code below to continue your Flynn James portfolio booking.</p><div class="code">{{verification_code}}</div><p class="copy">This code expires in 10 minutes. If you did not request this, you can ignore this email.</p></div></div></body></html>
